# Local development database (D11). Start with `docker compose up -d`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secupass
      POSTGRES_USER: secupass
      POSTGRES_PASSWORD: secupass-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
